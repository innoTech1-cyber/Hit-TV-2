<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>HIT TV</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding-bottom:70px}.top{padding:12px 15px;display:flex;justify-content:space-between;background:#0a1930;color:#fff}.logo{background:#fff;color:#0052ff;font-weight:900;padding:6px 10px;border-radius:4px}.section-head{padding:15px;display:flex;justify-content:space-between}.carousel{position:relative;width:92%;margin:0 auto;height:160px;border-radius:12px;overflow:hidden;background:#000}.slide{position:absolute;width:100%;height:100%;display:none}.slide.active{display:block}.slide img{width:100%;height:100%;object-fit:cover;opacity:.7}.slide-content{position:absolute;left:15px;top:20px;color:#fff;width:60%}.slide-content h2{font-size:22px;font-weight:900}.slide-btn{background:#ffcc00;color:#000;font-size:10px;padding:6px 12px;border-radius:15px;display:inline-block;margin-top:10px;font-weight:bold}.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.dot{width:7px;height:7px;background:rgba(255,255,255,.5);border-radius:50%}.dot.active{background:#fff;width:15px}.player-wrap{margin:15px;background:#08162e;border-radius:12px;overflow:hidden;color:#fff}.video-box{position:relative;width:100%;height:45vh;background:#000}.video-box video{width:100%;height:100%}.live-badge{position:absolute;top:10px;left:10px;background:red;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:bold}.info{padding:15px}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0}.nav-item{text-align:center;font-size:10px;color:#666;text-decoration:none}.nav-item b{display:block;font-size:18px}.nav-item.active{color:#000;font-weight:bold}</style></head><body><div class="top"><div class="logo">HIT TV<br><small>by InnoLabs</small></div><div><a href="studio.html" style="background:#0f2347;border:1px solid #1e3a6b;padding:6px 12px;border-radius:20px;font-size:12px;color:#fff;text-decoration:none">Studio</a></div></div><div class="section-head"><h3>What's hot</h3></div><div class="carousel"><div id="slides"></div><div class="dots" id="dots"></div></div><div class="section-head"><h3>Now Playing</h3></div><div class="player-wrap"><div class="video-box"><div class="live-badge">● LIVE</div><video id="mainVideo" controls autoplay></video></div><div class="info"><div style="color:#4a90e2;font-size:10px">NOW PLAYING</div><div style="font-size:18px;font-weight:800;margin-top:5px" id="nowTitle">Loading...</div><button onclick="nextVideo()" style="width:100%;margin-top:12px;padding:12px;border-radius:8px;border:0;background:#2f6bff;color:#fff;font-weight:bold">Next</button></div></div><div class="bottom-nav"><a class="nav-item active" href="index.html"><b>⌂</b>Home</a><a class="nav-item" href="#"><b>◫</b>Offers</a><a class="nav-item" href="studio.html"><b>+</b>Studio</a><a class="nav-item" href="#"><b>?</b>Help</a><a class="nav-item" href="#"><b>☺</b>Account</a></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyAGzXyxBHmvBcWwoyWo4Xjn_1pGRyQjO_M",authDomain:"hittvapp1-29f3a.firebaseapp.com",databaseURL:"https://hittvapp1-29f3a-default-rtdb.firebaseio.com",projectId:"hittvapp1-29f3a",storageBucket:"hittvapp1-29f3a.firebasestorage.app",messagingSenderId:"567256630691",appId:"1:567256630691:web:5e6e22fe24416eb3270616"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);let lineup=[];let current=0;const video=document.getElementById('mainVideo');onValue(ref(db,'lineup'),(s)=>{const d=s.val();if(d){lineup=Object.values(d);loadVideo(0);}else document.getElementById('nowTitle').innerText="No videos - Go to Studio";});function loadVideo(i){if(lineup.length==0)return;current=i%lineup.length;video.src=lineup[current].url;document.getElementById('nowTitle').innerText=lineup[current].title;video.play().catch(()=>{});}window.nextVideo=()=>loadVideo(current+1);video.onended=()=>loadVideo(current+1);let bannerIndex=0;let bannerInterval;onValue(ref(db,'banners'),(s)=>{const d=s.val();const slidesDiv=document.getElementById('slides');const dotsDiv=document.getElementById('dots');if(!d){slidesDiv.innerHTML=`<div class="slide active"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500" style="opacity:0.5"><div class="slide-content"><h2>Boredom ends here</h2><p>Post your first banner in Studio!</p><div class="slide-btn">Go to Studio</div></div></div>`;dotsDiv.innerHTML='<div class="dot active"></div>';return;}const banners=Object.values(d);slidesDiv.innerHTML=banners.map((b,i)=>`<div class="slide ${i==0?'active':''}"><img src="${b.image}"><div class="slide-content"><h2>${b.title}</h2><p>${b.desc}</p><div class="slide-btn">${b.btn||'Watch Now'}</div></div></div>`).join('');dotsDiv.innerHTML=banners.map((_,i)=>`<div class="dot ${i==0?'active':''}"></div>`).join('');startCarousel();});function startCarousel(){if(bannerInterval)clearInterval(bannerInterval);bannerIndex=0;bannerInterval=setInterval(()=>{const slides=document.querySelectorAll('.slide');const dots=document.querySelectorAll('.dot');if(slides.length<=1)return;slides[bannerIndex].classList.remove('active');dots[bannerIndex].classList.remove('active');bannerIndex=(bannerIndex+1)%slides.length;slides[bannerIndex].classList.add('active');dots[bannerIndex].classList.add('active');},3000);}</script></body></html>
