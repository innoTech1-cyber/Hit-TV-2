<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT TV by Inno</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1931;color:#e6f0ff;min-height:100vh;display:flex;flex-direction:column}
header{background:#0f2a5a;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1e5bff;position:sticky;top:0;z-index:20}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;background:linear-gradient(180deg,#0a1931,#122a5c)}
#login input{width:90%;max-width:320px;padding:14px;border-radius:30px;border:none;background:#11264f;color:white;text-align:center;margin:10px}
#login button{width:90%;max-width:320px;padding:14px;border-radius:30px;border:none;background:#1e5bff;color:white;font-weight:800}
#app{display:none;flex:1;flex-direction:column}
#liveVideo{width:100%;height:46vh;max-height:400px;background:black;object-fit:contain}
#controls{display:flex;gap:6px;padding:8px;background:#0f2a5a;align-items:center}
#controls button{padding:8px 12px;border-radius:20px;border:none;background:#11264f;color:white;cursor:pointer}
#dlBar{display:flex;gap:8px;padding:10px}
#dlBar a{flex:1;padding:12px;text-align:center;background:#0f2a5a;border:1px solid #1e5bff;border-radius:12px;color:white;text-decoration:none;font-weight:700;font-size:12px}
.banner{margin:10px;border-radius:12px;overflow:hidden;background:#11264f;min-height:80px;border:1px solid #1a3a6e}
.banner img{width:100%;display:block}
.page{display:none;flex:1;overflow-y:auto;padding:12px}.page.active{display:block}
.card{background:#0f2a5a;border:1px solid #1a3a6e;border-radius:14px;padding:12px;margin-bottom:10px}
.card video{width:100%;border-radius:10px;background:black}
.trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trend-grid img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.tabs{position:sticky;bottom:0;background:#0f2a5a;display:flex;padding:6px;border-top:2px solid #1e5bff}
.tab{flex:1;text-align:center;padding:10px 2px;font-size:11px;opacity:0.6;cursor:pointer;border-radius:10px}.tab.active{opacity:1;background:#1e5bff;font-weight:800}
#saver{padding:6px 10px;background:#11264f;border-radius:20px;font-size:11px;border:1px solid #1e5bff;cursor:pointer}
</style>
</head>
<body>
<header><h1>HIT TV <span style="color:#4da3ff">by Inno</span></h1><div style="display:flex;gap:8px;align-items:center"><div id="saver" onclick="toggleSaver()">📶 Saver: OFF</div><div id="uname" style="font-size:11px"></div></div></header>

<div id="login">
<h2 style="color:#7db4ff">HIT TV by Inno</h2>
<input id="userIn" placeholder="Enter username">
<button onclick="login()">SIGN IN</button>
<p style="font-size:10px;opacity:0.5;margin-top:10px">Owner login: Inno</p>
</div>

<div id="app">
<video id="liveVideo" controls playsinline></video>
<div id="controls">
<button onclick="togglePlay()">⏯️ Pause/Play</button>
<button onclick="stopVid()">⏹️ Stop</button>
<button onclick="nextVid()">⏭️ Next</button>
<span id="now" style="font-size:11px;opacity:0.6"></span>
</div>
<div id="dlBar">
<a id="dlMp4" download>⬇️ Video MP4</a>
<a id="dlMp3" download>⬇️ Audio MP3</a>
</div>
<div id="bannerBox"></div>

<div id="p-home" class="page active"><h3>Now Playing</h3><div id="lineup"></div></div>
<div id="p-view" class="page"><h3>View - Trending Images</h3><div id="trends" class="trend-grid"></div></div>
<div id="p-notif" class="page"><h3>🔔 Notifications</h3><div id="notifs"></div></div>
<div id="p-account" class="page"><div class="card"><b id="accName"></b><p style="font-size:12px;opacity:0.7;margin-top:8px">Username login • Data saver available<br>Only Inno can post • You are viewer</p><button onclick="location.reload()" style="margin-top:10px;padding:10px 20px;background:#1e5bff;border:none;color:white;border-radius:20px">Logout</button></div></div>

<div class="tabs">
<div class="tab active" onclick="go('home')">🏠<br>Home</div>
<div class="tab" onclick="go('view')">👁️<br>View</div>
<div class="tab" onclick="go('notif')">🔔<br>Notifs</div>
<div class="tab" onclick="go('account')">👤<br>Account</div>
<div class="tab" id="studioTab" style="display:none" onclick="location.href='studio.html'">🎬<br>Studio</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAGzXyxBHmvBcWwoyWo4Xjn_1pGRyQjO_M",authDomain:"hittvapp1-29f3a.firebaseapp.com",databaseURL:"https://hittvapp1-29f3a-default-rtdb.firebaseio.com",projectId:"hittvapp1-29f3a",storageBucket:"hittvapp1-29f3a.firebasestorage.app",messagingSenderId:"567256630691",appId:"1:567256630691:web:5e6e22fe24416eb3270616"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let me="",isOwner=false,saver=false,vids=[],cur=0,curUrl="";
function login(){me=document.getElementById('userIn').value.trim();if(!me)return alert("Enter name");isOwner=me.toLowerCase()=="inno";document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('uname').innerText=me;document.getElementById('accName').innerText=me+(isOwner?" 👑 Owner":"");if(isOwner)document.getElementById('studioTab').style.display='block';load();}
function go(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');event.currentTarget.classList.add('active');}
function toggleSaver(){saver=!saver;document.getElementById('saver').innerText=saver?"📶 Saver: ON":"📶 Saver: OFF";document.getElementById('saver').style.background=saver?"#1e5bff":"#11264f";if(curUrl)setVideo(curUrl);}
function setVideo(u){curUrl=u;let v=document.getElementById('liveVideo');v.src=u;v.play().catch(()=>{});document.getElementById('dlMp4').href=u;document.getElementById('dlMp3').href=u;document.getElementById('now').innerText="Playing";document.getElementById('dlMp4').download="HIT-TV.mp4";document.getElementById('dlMp3').download="HIT-TV.mp3";}
function togglePlay(){let v=document.getElementById('liveVideo');v.paused?v.play():v.pause();}
function stopVid(){let v=document.getElementById('liveVideo');v.pause();v.currentTime=0;document.getElementById('now').innerText="Stopped";}
function nextVid(){if(!vids.length)return;cur=(cur+1)%vids.length;setVideo(vids[cur].url);}
function load(){
db.ref("hittv_videos").on("value",s=>{vids=[];let h="";s.forEach(x=>{let d=x.val();if(!d.stopped)vids.push({k:x.key,...d});});vids.reverse();vids.forEach((d,i)=>{h+=`<div class="card" onclick="setVideo('${d.url}');cur=${i}"><b>${d.name}</b><video src="${d.url}" preload="metadata" muted style="${saver?'height:90px':''}"></video></div>`;});document.getElementById('lineup').innerHTML=h||"No videos - Owner go to Studio";if(vids[0]&&!curUrl)setVideo(vids[0].url);});
db.ref("hittv_banners").on("value",s=>{let h="";s.forEach(x=>{h+=`<div class="banner"><img src="${x.val().url}"></div>`;});document.getElementById('bannerBox').innerHTML=h||"<div class='banner' style='display:flex;align-items:center;justify-content:center;padding:20px'>Banner Ads</div>";});
db.ref("hittv_trending").on("value",s=>{let h="";s.forEach(x=>{h+=`<img src="${x.val().url}">`;});document.getElementById('trends').innerHTML=h||"No trending yet";});
db.ref("hittv_notifs").on("value",s=>{let h="";s.forEach(x=>{h+=`<div class="card">🔔 ${x.val().text}<br><small style="opacity:0.5">${new Date(x.val().time).toLocaleString()}</small></div>`;});document.getElementById('notifs').innerHTML=h||"No notifications";});
}
</script>
</body>
  </html>
